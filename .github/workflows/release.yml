name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the smoke test first
        run: bash tests/smoke.sh

      - name: Build the release zip (only tracked files, folder DWS/)
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          git archive --format=zip --prefix=DWS/ -o "DWS-${TAG}.zip" HEAD
          unzip -l "DWS-${TAG}.zip"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "DWS-${GITHUB_REF_NAME}.zip" \
            --title "DWS PREMIUM ${GITHUB_REF_NAME}" \
            --generate-notes
