<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="DWS PREMIUM V1 banner by d-rathnayake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="55%" stop-color="#0B1430"/>
      <stop offset="100%" stop-color="#12082A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39C5FF"/>
      <stop offset="50%" stop-color="#8B7BFF"/>
      <stop offset="100%" stop-color="#FF6EC7"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#FF6EC7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="880" cy="190" r="260" fill="url(#halo)">
      <animate attributeName="r" values="250;270;250" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: title block -->
    <text x="64" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" fill="url(#title)" filter="url(#glow)">DWS</text>
    <text x="68" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E6EDFF">PREMIUM V1</text>
    <text x="68" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9FB3D9">Termux and Linux terminal toolkit</text>

    <!-- Feature chips -->
    <rect x="68" y="262" width="150" height="36" rx="18" fill="#58A6FF" fill-opacity="0.15" stroke="#58A6FF" stroke-opacity="0.7"/>
    <text x="143" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ED2FF">ICON LS</text>
    <rect x="232" y="262" width="150" height="36" rx="18" fill="#8B7BFF" fill-opacity="0.15" stroke="#8B7BFF" stroke-opacity="0.7"/>
    <text x="307" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#CFC6FF">OFFLINE</text>
    <rect x="396" y="262" width="176" height="36" rx="18" fill="#FF6EC7" fill-opacity="0.15" stroke="#FF6EC7" stroke-opacity="0.7"/>
    <text x="484" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC2E6">ZERO TELEMETRY</text>

    <!-- Right: terminal window -->
    <rect x="620" y="44" width="520" height="262" rx="16" fill="#070B18" stroke="#2B3A66" stroke-width="1.5"/>
    <rect x="620" y="44" width="520" height="36" rx="16" fill="#101A36"/>
    <rect x="620" y="64" width="520" height="16" fill="#101A36"/>
    <circle cx="646" cy="62" r="6" fill="#FF5F56"/>
    <circle cx="666" cy="62" r="6" fill="#FFBD2E"/>
    <circle cx="686" cy="62" r="6" fill="#27C93F"/>
    <text x="716" y="67" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8FA3CC">termux ~ dws</text>

    <g font-family="Consolas, Menlo, Courier New, monospace" font-size="16">
      <text x="642" y="116" fill="#58A6FF" opacity="0">$ dws
        <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="146" fill="#9ED2FF" opacity="0">  ◈ Banner   DWS
        <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="170" fill="#84FFB0" opacity="0">  ◈ Device   Android · Termux
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="194" fill="#FFD479" opacity="0">  ◈ Uptime   2h 14m
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="218" fill="#7FD8FF" opacity="0">  ◈ Store    13G/21G (63%)
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="242" fill="#FF9F68" opacity="0">  ◈ Time     02:36 PM
        <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="642" y="276" fill="#58A6FF" opacity="0">$
        <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/>
      </text>
      <rect x="656" y="262" width="9" height="18" fill="#58A6FF">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Bottom rail: animated progress bar -->
    <rect x="68" y="326" width="1064" height="8" rx="4" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="68" y="326" width="1064" height="8" rx="4" fill="url(#rail)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="1064" dur="3.5s" fill="freeze"/>
    </rect>

    <!-- Developer credit -->
    <text x="68" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8FA3CC">dev · <tspan font-weight="700" fill="#FF6EC7">d-rathnayake</tspan></text>

    <!-- Sparks -->
    <circle cx="560" cy="60" r="2" fill="#58A6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="330" r="2" fill="#FF6EC7"><animate attributeName="cy" values="330;310;330" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="30" r="1.8" fill="#8B7BFF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
